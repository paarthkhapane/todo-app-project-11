{% extends "base.html" %} {% block title %}Log In | FlowTask{% endblock %} {%
block content %}
<main class="auth-shell">
  <aside class="auth-brand-panel">
    <div>
      <div class="prototype-logo">F</div>
      <h2>FlowTask</h2>
      <p>Plan clearly. Finish confidently.</p>
    </div>
  </aside>

  <section class="auth-form-panel">
    <div class="auth-card">
      <p class="eyebrow">WELCOME BACK</p>
      <h1>Log in to FlowTask</h1>
      <p class="muted">Enter your details to access your account.</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="login-email">Email Address</label>
          <input
            class="input"
            id="login-email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="name@example.com"
            required
            aria-describedby="login-email-error"
          />
          <span class="field-error" id="login-email-error" role="alert"></span>
        </div>

        <div class="field password-field">
          <label for="login-password">Password</label>
          <input
            class="input"
            id="login-password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
            aria-describedby="login-password-error"
          />
          <button
            class="password-toggle"
            type="button"
            data-password-toggle="login-password"
            aria-label="Show password"
          >
            Show
          </button>
          <span
            class="field-error"
            id="login-password-error"
            role="alert"
          ></span>
        </div>

        <div class="auth-options">
          <label class="check-label">
            <input type="checkbox" id="remember-me" name="remember" />
            Remember me
          </label>
        </div>

        <div
          class="auth-feedback"
          id="login-feedback"
          role="alert"
          hidden
        ></div>
        <p class="field-error" id="login-error" role="alert"></p>

        <button
          class="btn btn-primary auth-submit"
          id="login-submit"
          type="submit"
        >
          Log In
        </button>
      </form>

      <p class="auth-switch">
        Don't have an account?
        <a href="{{ url_for('register_page') }}" class="text-button">
          Create an account
        </a>
      </p>
    </div>
  </section>
</main>
{% endblock %}
